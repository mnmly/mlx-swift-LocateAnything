# Build the library + CLI and run the pure (no-GPU) unit tests on every push / PR.
#
# The MLX-runtime tests (ParityTests, SessionTests) are gated on env vars and skip
# here: GitHub macOS runners have no Metal GPU, so MLX compute can't execute. Only
# the pure tests (config decode, prompt building, EXIF orientation) run in CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (library + CLI)
        run: swift build

      - name: Test (pure, no GPU)
        run: swift test --filter "ConfigTests|PromptTests|ImageTests"
